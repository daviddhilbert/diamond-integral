name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build pinned Lean project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Lean and download the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'

      - name: Prepare approved library correction
        run: python3 'section 2/prepare-reuse.py'

      - name: Build the Lean project
        run: lake -R build

      - name: Audit section 2 exports
        run: lake env python3 'section 2/verify.py'
