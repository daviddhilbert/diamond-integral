name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build pinned Lean project
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore compiled Lean files
        id: lean-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lean-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up Lean and download the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: Prepare verified dependency sources
        run: |
          python3 'section 5/prepare-dependencies.py'

      - name: Build the Lean project
        run: lake -R build

      # The setup action completes before our external build. Saving its cache
      # there would retain Mathlib alone and discard the expensive proof build.
      - name: Save compiled Lean files
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}

      - name: Audit section 2 exports
        run: lake env python3 'section 2/verify.py'

      - name: Audit section 3 exports
        run: lake env python3 'section 3/verify.py'

      - name: Audit section 4 exports
        run: lake env python3 'section 4/verify.py'

      - name: Audit section 5 exports and discharged inputs
        run: lake env python3 'section 5/verify.py'

      - name: Audit section 6 and the bounded aperture revision
        run: lake env python3 'section 6/verify.py'
