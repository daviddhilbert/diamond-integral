name: Blueprint

on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "section */**.lean"
      - "DiamondIntegral.lean"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "SHARED-FOUNDATION.json"
      - "EXTRACTED-FOUNDATIONS.json"
      - "section */verification/status.json"
      - "section 3/verification/VERIFICATION.json"
      - "paper/bounded-integral-motivic-milnor-fiber.tex"
      - ".github/workflows/blueprint.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: blueprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        id: pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blueprint/requirements.txt
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev
      - name: Fetch the pinned provider sources for declaration anchors
        run: |
          python3 - <<'EOF' > pins.txt
          import json
          wanted = {'hilbert-mathlib', 'fubini_theorems', 'integration_in_acvf', 'special_transformations', 'acvf_qe'}
          for p in json.load(open('lake-manifest.json'))['packages']:
              name = p['name'].strip('«»')
              if name in wanted:
                  print(name, p['rev'], p['url'])
          EOF
          while read -r name rev url; do
            git clone --quiet --filter=blob:none --no-checkout "$url" ".lake/packages/$name"
            git -C ".lake/packages/$name" checkout --quiet "$rev"
          done < pins.txt
      - name: Render and validate the blueprint
        run: |
          python -m pip install -r blueprint/requirements.txt
          python blueprint/scripts/check.py
          leanblueprint web
          python blueprint/scripts/check.py --rendered
          test -s blueprint/web/index.html
          test -s blueprint/web/dependency-graph.svg
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-blueprint
          path: blueprint/web
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && steps.pages.outcome == 'success'
        with:
          path: blueprint/web

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
